<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <script>
    // GitHub Pages serves this file for any path it can't find on disk — which, for a
    // single-page app, is every deep link and every hard refresh (e.g. /clothing-band/shop).
    // Redirect to the app root with the original path preserved as a query param, so the
    // Angular router (see app.ts) can restore it after bootstrap.
    const path = window.location.pathname;
    const base = '/clothing-band';
    const appPath = path.startsWith(base) ? path.slice(base.length) : path;
    const redirectPath = (appPath || '/') + window.location.search;
    window.location.replace(base + '/?redirect=' + encodeURIComponent(redirectPath));
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
